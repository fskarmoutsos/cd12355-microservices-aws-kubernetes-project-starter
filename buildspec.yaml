version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building Docker image..."
      - docker build -t $ECR_REPOSITORY:$CODEBUILD_BUILD_NUMBER ./analytics
      - docker tag $ECR_REPOSITORY:$CODEBUILD_BUILD_NUMBER $IMAGE_URI:$CODEBUILD_BUILD_NUMBER

  post_build:
    commands:
      - echo "Build completed on $(date)"
      - echo "Pushing Docker image to ECR..."
      - docker push $IMAGE_URI:$CODEBUILD_BUILD_NUMBER
      - echo "Image pushed successfully"
      - echo "$IMAGE_URI:$CODEBUILD_BUILD_NUMBER"